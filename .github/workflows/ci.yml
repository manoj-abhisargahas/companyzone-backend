name: Django Full-Stack CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  full-stack-test-pipeline:
    runs-on: ubuntu-latest
    # Tells the job to look inside your subfolder
    defaults:
      run:
        working-directory: ./companyzone

    services:
      # Replicates your Clever Cloud MySQL environment locally
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: test_django_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    # STEP 1: downloads repository’s code onto the GitHub Actions runner
    - name: Checkout repository
      uses: actions/checkout@v4

    # STEP 2: Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    # STEP 3: Run linter fast. If this fails, the script halts instantly!
    - name: Run Linter - Flake8
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

     # STEP 4: Install core Django dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # STEP 5: Copy the dummy env configuration into place for Django to read
    - name: Set up Test Environment Variables
      run: |
        cp .env.local .env

    # STEP 6: Tests WhiteNoise configuration and assets layout
    - name: Test Static Files Compilation
      run: |
        python manage.py collectstatic --noinput
      
    # STEP 7: Execute migrations and backend logic verification, sub-app APIs, 
    # database integration, and DTL template verification
    - name: Run Full-Stack Tests
      run: |
        python manage.py test